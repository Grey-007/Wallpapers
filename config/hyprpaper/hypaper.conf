# -----------------------------------------
# Hyprpaper - Matte Theme (Premium Layout)
# -----------------------------------------

# Preload all matte wallpapers (fast switching if you add more)
preload = ~/.config/wallpapers/matte/01-main.jpg
preload = ~/.config/wallpapers/matte/02-alt.jpg
preload = ~/.config/wallpapers/matte/03-alt.jpg

# Explicit monitor mapping for your HDMI-1 display
wallpaper = HDMI-1,~/.config/wallpapers/matte/01-main.jpg

# No stupid splash
splash = false

# Enable ipc so we can change wallpapers live later if we want
ipc = on
