window {
    margin: 0px;
    padding: 0px;
    border-radius: 10px;
    border: 2px solid rgba(192, 20, 23, 0.8); /* bright red */
    background-color: #0a0a0a;
    color: #e0e0e0;
    font-family: "Fira Sans", "Iosevka Nerd Font", sans-serif;
    font-size: 12px;
}

#outer-box {
    padding: 10px 14px 12px 14px;
    background-color: #0a0a0a;
}

#input {
    border-radius: 8px;
    padding: 6px 10px;
    margin-bottom: 8px;
    border: 1px solid #5a0a0b;       /* dark red */
    background-color: #141414;
    color: #e0e0e0;
}

#input:focus {
    border: 1px solid #c01417;
}

#scroll {
    margin-top: 4px;
}

#entry {
    padding: 4px 8px;
    border-radius: 6px;
    background-color: transparent;
    color: #e0e0e0;
}

#entry:selected {
    background-color: rgba(192, 20, 23, 0.85); /* red highlight */
    color: #0a0a0a;
}

#text {
    margin-left: 6px;
}

#img {
    margin-right: 4px;
}

#entry:selected #text {
    font-weight: 500;
}
