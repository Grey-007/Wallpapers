########################################
# Keybinds - Hyprland Modern Style
########################################

# Window focus (move between windows)
bind = SUPER, left,  movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up,    movefocus, u
bind = SUPER, down,  movefocus, d

# Move windows
bind = SUPER SHIFT, left,  movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up,    movewindow, u
bind = SUPER SHIFT, down,  movewindow, d

# Workspaces (1–9)
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9

# Move active window to workspace (1–9)
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9

# Floating / fullscreen / close / pseudo
bind = SUPER, space, togglefloating
bind = SUPER, f, fullscreen, 1
bind = SUPER, t, pseudo
bind = SUPER, q, killactive

# Minimal layout controls
bind = SUPER, v, layoutmsg, togglesplit      # toggle split direction
bind = SUPER, m, layoutmsg, togglemaster     # promote/demote master

# App launching
bind = SUPER, RETURN, exec, kitty
bind = SUPER, ESC,    exec, wofi --show drun
bind = SUPER, b,      exec, firefox

# System controls (needs pamixer + brightnessctl)
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5
bind = , XF86AudioLowerVolume, exec, pamixer -d 5
bind = , XF86AudioMute,        exec, pamixer -t

bind = , XF86MonBrightnessUp,   exec, brightnessctl set +10%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%-

# Screenshots (grimblast)
bind = SUPER, s,        exec, grimblast copy area
bind = SUPER SHIFT, s,  exec, grimblast copy output
bind = SUPER ALT,   s,  exec, grimblast save area ~/Pictures/Screenshots/

# Hyprland maintenance / lock
bind = SUPER, r,        exec, hyprctl reload
bind = SUPER SHIFT, e,  exit
bind = SUPER, l,        exec, hyprlock

##powermenu
bind = SUPER, ESC        exec, ~/.config/hypr/scripts/powermenu.sh