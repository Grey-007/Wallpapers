# ----------------------------------------------------
# Hyprlock - Matte Minimal + macOS Style (Time + User)
# ----------------------------------------------------

# Background
background {
    color = rgba(10, 10, 10, 1.0)
}

# Big Clock (centered)
label {
    monitor = all
    content = $TIME12
    font = Fira Sans
    font_size = 70
    color = rgba(224,224,224,1.0)
    position = 0, -200     # Time sits higher like macOS
}

# Username Label (macOS style)
label {
    monitor = all
    content = $USER
    font = Fira Sans
    font_size = 26
    color = rgba(180,180,180,1.0)
    position = 0, -140     # Just below the time
}

# Password Input Field (macOS inspired)
input-field {
    monitor = all

    size = 320, 52
    outline_thickness = 2

    # Dark red subtle border
    outline_color = rgba(90,10,11,1.0)

    # Matte grey background
    color = rgba(20,20,20,1.0)

    # Text color
    text_color = rgba(224,224,224,1.0)

    font = Fira Sans
    font_size = 16

    rounding = 10   # macOS-style rounded input

    hide_input = true   # Hide password characters

    placeholder_text = Enter Password
    placeholder_color = rgba(140,140,140,1.0)

    # The red accent highlight (minimal)
    highlight_color = rgba(192,20,23,1.0)
    highlight_thickness = 2

    blur = false     # matte mode
}

# Unlock indicator circle (very subtle)
indicator {
    monitor = all
    enabled = true

    # matte circle
    color = rgba(20,20,20,1.0)

    # dark red border
    outline_color = rgba(90,10,11,1.0)
    outline_thickness = 3

    size = 140
    rounding = -1

    pulse_on_unlock = false
    pulse_on_fail = false
}
