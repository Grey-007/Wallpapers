########################################
# Animations (minimal but smooth)
########################################

animations {
    enabled = yes

    bezier = smooth, 0.1, 0.9, 0.2, 1.0

    animation = windows,     1, 3, smooth, popin
    animation = windowsOut,  1, 3, smooth, popout
    animation = border,      1, 5, smooth
    animation = fade,        1, 5, smooth
    animation = workspaces,  1, 4, smooth, slide
}
