# --- INPUT SETTINGS ---
input {
    kb_layout = us
    kb_variant =
    kb_options = caps:escape

    repeat_rate = 40
    repeat_delay = 300

    numlock_by_default = true

    # Applies only when using a laptop
    touchpad {
        natural_scroll = true
        tap-to-click   = true
        scroll_factor  = 0.8
        middle_button_emulation = true
    }
}
