# -------- Kitty - Matte Minimal (Red/Black) --------

font_family      Iosevka Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Colours
foreground       #e0e0e0
background       #0a0a0a

selection_background #5a0a0b
selection_foreground #e0e0e0

cursor           #c01417
cursor_text_color #0a0a0a

url_color        #c01417

# Black / Bright black
color0  #000000
color8  #141414

# Red
color1  #5a0a0b
color9  #c01417

# Green (kept muted and neutral)
color2  #4b6a4b
color10 #6b8a6b

# Yellow
color3  #7a6b3a
color11 #ba9b4a

# Blue
color4  #34506b
color12 #4b6f8a

# Magenta
color5  #6b3a5a
color13 #8a4a7a

# Cyan
color6  #3a6b6b
color14 #4a8a8a

# White
color7  #d0d0d0
color15 #f0f0f0

# Window
window_padding_width 8
window_margin_width  0
inactive_text_alpha  0.8

# Tabs (simple, matte)
tab_bar_edge       top
tab_bar_style      powerline
tab_powerline_style angled
tab_bar_min_tabs   1
tab_title_template {index}: {title}

active_tab_foreground   #0a0a0a
active_tab_background   #c01417
inactive_tab_foreground #e0e0e0
inactive_tab_background #141414

# Behaviour
confirm_os_window_close 0
enable_audio_bell no
