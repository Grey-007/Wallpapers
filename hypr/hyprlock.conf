### COLORS / FONTS ###########################################################

# Match your rice
$fg        = rgba(245, 245, 245, 1.0)
$fg_soft   = rgba(245, 245, 245, 0.75)
$accent    = rgba(255, 55, 55, 1.0)
$input_bg  = rgba(0, 0, 0, 0.45)
$input_o   = rgba(0, 0, 0, 0.7)

$font_main = JetBrainsMono Nerd Font

### BACKGROUND ###############################################################

# Blurred screenshot of your desktop like in the image
background {
    monitor =
    path = screenshot
    color = rgba(10, 10, 10, 1.0)

    blur_passes = 3
    blur_size   = 8
    noise       = 0.012
    contrast    = 1.0
    brightness  = 0.6
    vibrancy    = 0.20
    vibrancy_darkness = 0.20
}

### GENERAL ##################################################################

general {
    no_fade_in         = true
    no_fade_out        = true
    hide_cursor        = true
    grace              = 0
    disable_loading_bar = true
}

### INPUT FIELD (PILL BUTTON UNDER GREETING) #################################

### INPUT FIELD (PILL BELOW GREETING) ########################################

input-field {
    monitor =

    size = 260, 52
    outline_thickness = 2

    dots_size    = 0.25
    dots_spacing = 0.35
    dots_center  = true

    outer_color = rgba(0,0,0,0.7)
    inner_color = rgba(0,0,0,0.45)
    font_color  = rgba(245,245,245,1.0)

    rounding = 999
    fade_on_empty = false

    check_color = rgba(255,55,55,1.0)
    fail_color  = rgba(255,80,80,1.0)

    placeholder_text = Input Password...
    fail_text        = Wrong password :(

    position = 0, -180        # ⬅ moved DOWN under greeting
    halign   = center
    valign   = center
}
### CLOCK (NOW ON TOP) #######################################################

label {
    monitor =

    text = cmd[update:1000] echo "$(date +"%-I:%M%p")"

    # subtle matte red
    color = rgba(255,70,70,0.85)

    font_size   = 140
    font_family = Bitcount Prop Single Roman Medium

    shadow_passes = 2
    shadow_size   = 4
    shadow_color  = rgba(0,0,0,0.6)

    position = 0, 200      # ⬅ move clock UP
    halign   = center
    valign   = center
}


### GREETING (CENTERED BETWEEN CLOCK + PILL) ##################################

label {
    monitor =

    text = Hi there, $USER
    color = rgba(245,245,245,0.75)
    font_size   = 22
    font_family = JetBrainsMono Nerd Font

    position = 0, 50       # ⬅ perfectly between clock and pill
    halign   = center
    valign   = center
}

### DATE / SMALL TEXT AT BOTTOM ##############################################

# Bottom-center text (like the song/quote line in the screenshot)
label {
    monitor =

    text = cmd[update:1000] echo "$(date +"%A, %B %d · %Y")"
    color = rgba(245, 245, 245, 0.55)
    font_size   = 14
    font_family = $font_main

    position = 0, -20
    halign   = center
    valign   = bottom
}
